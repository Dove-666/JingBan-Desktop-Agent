<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鲸伴 · 启动图标提案</title>
  <style>
    :root{color-scheme:light;--ink:#16304a;--muted:#768697;--line:#e2e8ef;--stage:#f8fafc;--paper:#fff}
    *{box-sizing:border-box}
    body{margin:0;background:#f1f4f7;color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    button{font:inherit;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:3px solid #62b9e4;outline-offset:4px}
    main{max-width:1600px;margin:auto;padding:40px 44px 48px}
    header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:32px}
    .eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:#6483a0;margin:0 0 10px}
    h1{font-size:30px;line-height:1.25;letter-spacing:-.8px;margin:0;font-weight:650}
    .subline{font-size:13px;line-height:1.7;color:var(--muted);margin:10px 0 0}
    .controls{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:12px}
    .segment{display:flex;gap:3px;padding:4px;border:1px solid var(--line);border-radius:12px;background:#e9eef3}
    .segment button{border:0;border-radius:8px;background:transparent;color:#62758a;padding:9px 13px;font-size:13px;white-space:nowrap}
    .segment button[aria-pressed="true"]{background:#fff;color:#173b5a;box-shadow:0 1px 5px #1c3c5520}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
    .card{min-width:0;margin:0;padding:14px;border:1px solid #e0e7ee;border-radius:20px;background:var(--paper);box-shadow:0 3px 12px #18314b04}
    .art-button{display:block;width:100%;aspect-ratio:1;border:0;border-radius:13px;padding:12px;background:var(--stage);overflow:hidden;transition:background .18s ease}
    .art-button:hover .art{transform:scale(1.025)}
    .art{display:block;width:100%;height:100%;object-fit:contain;transition:transform .2s ease,border-radius .2s ease}
    figcaption{display:flex;align-items:center;gap:10px;margin:16px 2px 12px;font-size:15px;font-weight:600;line-height:24px}
    .number{font-size:11px;line-height:24px;min-width:28px;text-align:center;border-radius:7px;background:#edf3f7;color:#668098;letter-spacing:.5px;font-variant-numeric:tabular-nums}
    .sizes{display:flex;justify-content:center;align-items:flex-end;gap:26px;min-height:96px;padding:8px 0 0;border-top:1px solid #edf1f5}
    .size-sample{display:flex;flex-direction:column;align-items:center;gap:8px}
    .sample-stage{display:grid;place-items:center;border-radius:8px;background:var(--stage);padding:4px}
    .sample-stage img{display:block;object-fit:contain}
    .size-label{font-size:10px;line-height:16px;color:#8b98a6;font-variant-numeric:tabular-nums}
    footer{text-align:center;font-size:12px;color:#8794a3;line-height:1.7;margin-top:28px}
    body[data-background="dark"]{--stage:#182330}
    body[data-shape="rounded"] .art,body[data-shape="rounded"] .sample-stage img{border-radius:24%}
    body[data-shape="circle"] .art,body[data-shape="circle"] .sample-stage img{border-radius:50%}
    dialog{padding:0;border:1px solid #d9e3ec;border-radius:24px;max-width:min(860px,94vw);width:860px;max-height:94vh;overflow:auto;background:white;box-shadow:0 24px 100px #0005}
    dialog::backdrop{background:#142535aa;backdrop-filter:blur(10px)}
    .viewer-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px}
    .viewer-title{font-size:16px;font-weight:650;margin:0}
    .viewer-actions{display:flex;align-items:center;gap:14px}
    .original-link{font-size:13px;color:#4b718f;text-decoration:none}
    .close{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:50%;background:#eef3f7;color:#587087;font-size:24px;line-height:1}
    .viewer-stage{margin:0 16px 16px;padding:18px;border-radius:14px;background:var(--stage)}
    .viewer-stage img{display:block;max-width:100%;max-height:76vh;width:auto;height:auto;margin:auto;object-fit:contain}
    @media(max-width:1100px){main{padding:28px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}header{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}}
    @media(max-width:720px){main{padding:22px 16px 32px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:10px;border-radius:16px}.art-button{padding:6px}h1{font-size:25px}figcaption{font-size:13px;gap:7px;margin:12px 0}.sizes{gap:10px}.segment button{padding:8px 11px}.subline{font-size:12px}}
    @media(max-width:430px){.grid{grid-template-columns:1fr}.sizes{gap:28px}.sample-stage{padding:4px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
    body.sheet{width:1600px;min-width:1600px}
    .sheet main{width:1600px;max-width:none;padding:36px 48px 28px}
    .sheet header{height:100px;margin-bottom:24px;display:block}
    .sheet h1{font-size:34px}
    .sheet .subline{margin-top:8px}
    .sheet .controls,.sheet .sizes,.sheet footer{display:none}
    .sheet .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;grid-auto-rows:390px}
    .sheet .card{height:390px;padding:16px;border-radius:18px;box-shadow:none}
    .sheet .art-button{height:318px;aspect-ratio:auto;padding:8px;border-radius:10px;pointer-events:none}
    .sheet figcaption{margin:16px 2px 0;line-height:24px;font-size:16px}
    .sheet .number{font-size:12px}
  </style>
</head>
<body data-background="light" data-shape="original">
  <main>
    <header>
      <div>
        <p class="eyebrow">鲸伴 / ICON EXPLORATIONS</p>
        <h1>同一个鲸鱼娘，十二种表达</h1>
        <p class="subline">点击查看原图 · 同时看看缩小后的效果</p>
      </div>
      <div class="controls" aria-label="预览选项">
        <div class="segment" role="group" aria-label="预览背景">
          <button type="button" data-background="light" aria-pressed="true">浅色</button>
          <button type="button" data-background="dark" aria-pressed="false">深色</button>
        </div>
        <div class="segment" role="group" aria-label="图标裁切形状">
          <button type="button" data-shape="original" aria-pressed="true">原图</button>
          <button type="button" data-shape="rounded" aria-pressed="false">圆角</button>
          <button type="button" data-shape="circle" aria-pressed="false">圆形</button>
        </div>
      </div>
    </header>
    <section class="grid" aria-label="十二款图标候选" id="candidates"></section>
    <footer>32 / 48 / 64 为实际 CSS 像素预览 · 原图保持不变 · 选定后再制作桌面与手机图标</footer>
  </main>
  <dialog id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-bar">
      <p id="viewer-title" class="viewer-title"></p>
      <div class="viewer-actions">
        <a class="original-link" id="original-link" target="_blank" rel="noopener">打开原图</a>
        <button class="close" id="close-viewer" type="button" aria-label="关闭预览">×</button>
      </div>
    </div>
    <div class="viewer-stage"><img id="viewer-image" alt=""></div>
  </dialog>
  <script>
    const choices = [
      ['01-flat-mascot.png', '清爽平涂'],
      ['02-cream-clay.png', '奶油软陶'],
      ['03-ice-glass.png', '冰蓝琉璃'],
      ['04-enamel-badge.png', '珐琅徽章'],
      ['05-paper-cut.png', '层叠纸雕'],
      ['06-pixel.png', '复古像素'],
      ['07-wave-mark.png', '极简海浪标志'],
      ['08-felt-plush.png', '软绒玩偶'],
      ['09-anime-portrait.png', '清透日系'],
      ['10-pop-sticker.png', '潮玩贴纸'],
      ['11-neon.png', '深海霓虹'],
      ['12-watercolor.png', '水彩绘本'],
    ];
    const sheet = new URLSearchParams(location.search).get('sheet') === '1';
    if (sheet) {
      document.body.classList.add('sheet');
      document.querySelector('.subline').textContent = '桌面 / Android 启动图标候选 · 01—12';
    }
    const gallery = document.getElementById('candidates');
    const viewer = document.getElementById('viewer');
    for (const [index, [file, name]] of choices.entries()) {
      const number = String(index + 1).padStart(2, '0');
      const card = document.createElement('figure');
      card.className = 'card';
      const button = document.createElement('button');
      button.className = 'art-button';
      button.type = 'button';
      button.setAttribute('aria-label', `放大 ${number} ${name}`);
      const image = document.createElement('img');
      image.className = 'art';
      image.src = file;
      image.alt = `${number} ${name}鲸鱼娘图标`;
      image.decoding = 'sync';
      button.append(image);
      const caption = document.createElement('figcaption');
      const badge = document.createElement('span');
      badge.className = 'number';
      badge.textContent = number;
      const label = document.createElement('span');
      label.textContent = name;
      caption.append(badge, label);
      const sizes = document.createElement('div');
      sizes.className = 'sizes';
      for (const size of [32, 48, 64]) {
        const sample = document.createElement('div');
        sample.className = 'size-sample';
        const stage = document.createElement('span');
        stage.className = 'sample-stage';
        const small = document.createElement('img');
        small.src = file;
        small.alt = `${size} 像素预览`;
        small.width = size;
        small.height = size;
        stage.append(small);
        const sizeLabel = document.createElement('span');
        sizeLabel.className = 'size-label';
        sizeLabel.textContent = `${size} px`;
        sample.append(stage, sizeLabel);
        sizes.append(sample);
      }
      button.addEventListener('click', () => {
        const expanded = document.getElementById('viewer-image');
        expanded.src = file;
        expanded.alt = `${number} ${name}鲸鱼娘图标原图`;
        document.getElementById('viewer-title').textContent = `${number} · ${name}`;
        document.getElementById('original-link').href = file;
        viewer.showModal();
      });
      card.append(button, caption, sizes);
      gallery.append(card);
    }
    for (const attribute of ['background', 'shape']) {
      document.querySelectorAll(`button[data-${attribute}]`).forEach(button => {
        button.addEventListener('click', () => {
          document.body.dataset[attribute] = button.dataset[attribute];
          document.querySelectorAll(`button[data-${attribute}]`).forEach(item => {
            item.setAttribute('aria-pressed', String(item === button));
          });
        });
      });
    }
    document.getElementById('close-viewer').addEventListener('click', () => viewer.close());
    viewer.addEventListener('click', event => {
      if (event.target !== viewer) return;
      const rect = viewer.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) viewer.close();
    });
    Promise.all([...document.images].map(image => image.complete ? Promise.resolve() : new Promise(resolve => {
      image.addEventListener('load', resolve, { once: true });
      image.addEventListener('error', resolve, { once: true });
    }))).then(() => { document.documentElement.dataset.galleryReady = 'true'; });
  </script>
</body>
</html>
